<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiaGold Scan HP</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section id="join-screen">
    <h1>Scan baki</h1>
    <p class="hint">Laptop wajib nyala. Ketik kode sesi yang sama.</p>
    <label>Nama
      <input id="join-name" type="text" autocomplete="nickname" placeholder="Anonim">
    </label>
    <label>Kode sesi
      <input id="join-code" type="text" autocapitalize="characters" autocomplete="off" placeholder="Kode sesi">
    </label>
    <button id="join-btn" type="button">Masuk</button>
    <p id="join-status" class="status"></p>
    <p class="footer">phone-scanner 1</p>
  </section>

  <section id="scan-screen" hidden>
    <label class="cam-switch">
      <span>Kamera</span>
      <input id="cam-toggle" type="checkbox" checked>
    </label>
    <div class="cam-wrap">
      <video id="cam" playsinline muted autoplay></video>
      <svg id="cam-box" class="cam-box">
        <polygon id="cam-box-poly"></polygon>
      </svg>
      <button type="button" id="cam-code" class="cam-code" hidden></button>
      <div id="cam-flash" class="cam-flash"></div>
    </div>
    <p id="cam-status" class="status"></p>
    <div id="zoom-wrap" hidden>
      <label>Zoom
        <input id="zoom" type="range">
      </label>
    </div>
    <label>Baki
      <select id="tray"></select>
    </label>
    <div class="scan-wrap">
      <div class="scan-row">
        <input id="scan-input" type="text" autocomplete="off" placeholder="Kode / barcode">
        <button id="scan-btn" type="button">CEK</button>
      </div>
      <div id="suggest" hidden></div>
    </div>
    <p id="result" class="result"></p>
    <div id="stats" class="stats-grid"></div>
    <p class="hint">Klik kartu untuk filter · Semua / Sudah / Belum = daftar barang</p>
    <p id="peserta" class="peserta"></p>
    <div id="filter-banner" hidden>
      <span id="filter-banner-text"></span>
      <button type="button" id="clear-filter">✕ Reset Filter</button>
    </div>
    <div class="list-head">
      <span>Daftar barang</span>
      <div class="tabs">
        <button type="button" class="scan-tab on" data-val="all">Semua <span data-count="all">0</span></button>
        <button type="button" class="scan-tab" data-val="scanned">Sudah <span data-count="scanned">0</span></button>
        <button type="button" class="scan-tab" data-val="unscanned">Belum <span data-count="unscanned">0</span></button>
      </div>
    </div>
    <ul id="products"></ul>
    <p class="hint">Riwayat Scan</p>
    <ul id="log"></ul>
    <button id="leave-btn" type="button" class="ghost">Keluar</button>
  </section>
  <div id="photo-overlay" hidden>
    <div class="photo-card" role="dialog" aria-modal="true" aria-labelledby="photo-title">
      <div id="photo-title"></div>
      <div id="photo-img-wrap"></div>
      <div class="photo-actions">
        <button type="button" id="photo-fill">Isi ke scan</button>
        <button type="button" id="photo-close" class="ghost">Tutup</button>
      </div>
    </div>
  </div>
  <script src="./vendor/jsQR.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
